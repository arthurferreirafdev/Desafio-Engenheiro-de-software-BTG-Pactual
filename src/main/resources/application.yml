spring:
  application:
    name: btg-orders-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/btg}
    username: ${SPRING_DATASOURCE_USERNAME:btg}
    password: ${SPRING_DATASOURCE_PASSWORD:btg}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
      path-mapping:
        health: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState, db, rabbit

springdoc:
  swagger-ui:
    path: /swagger
