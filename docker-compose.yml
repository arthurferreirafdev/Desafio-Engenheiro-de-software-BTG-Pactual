services:
  postgres:
    image: postgres:16-alpine
    container_name: btg-postgres
    environment:
      POSTGRES_DB: btg
      POSTGRES_USER: btg
      POSTGRES_PASSWORD: btg
    ports:
      - "5432:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btg -d btg"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - btg

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: btg-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - btg

  api:
    build: .
    container_name: btg-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/btg
      SPRING_DATASOURCE_USERNAME: btg
      SPRING_DATASOURCE_PASSWORD: btg
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8080:8080"
    networks:
      - btg

volumes:
  postgres-dados:

networks:
  btg:
